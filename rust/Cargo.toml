[package]
name = "rust_lib_siplayer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "=1.0.75"
base64 = "=0.23.1"
dirs = "=7.0.0"
flutter_rust_bridge = "=2.13.0"
getrandom = "=0.3.4"
librqbit = { version = "=9.0.1", features = ["http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "=0.7.0"
tokio = { version = "=1.53.3", features = ["full"] }
tracing = "=0.1.44"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
